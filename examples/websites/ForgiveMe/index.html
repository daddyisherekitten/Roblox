<!doctype html>
<html>
<head>
<style data-wttg2-cursor>[onmouseover*="LinkHover"] { cursor: pointer; }</style>
<script src="/wttg2-config.js"></script>
<script src="/wttg2-host-bridge.js"></script>

	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
	<meta name="description" content="">
	<title>Forgive Me</title>
	<link rel="stylesheet" href="style.css" type="text/css">
	<script language="javascript" type="text/javascript" src="../jQuery.min.js"></script>
<script>WTTG2Host.installJQuery();</script>
	<script language="javascript" type="text/javascript" src="../basic.js"></script>
	<script language="javascript" type="text/javascript">
		var current = 0;
		var confessions = '';
		
		function showConfession(i){
		  $('#confession').html("<p>" + confessions[i] + "</p>");
		}
		
		$(document).ready(function() {
			$.get( "http://wttg2.reflectstudios.com/stats.php?action=getPubConfessions", function( data ) {
				confessions = JSON.parse(data).data.split("|");
				if(confessions.length){
					showConfession(0);
				}
			});

			$('#doBack').click(function(){
				if (current > 0){
					current -= 1;
					showConfession(current);
				}
			});

			$('#doForward').click(function(){
				if ((current + 1) < confessions.length){
					current += 1;
					showConfession(current);
				}
			});
		});		
	</script>
</head>
<body>
	<header>
		<img src="images/logo.png" alt="">
	</header>
	<div id="content1">
		<div id="back" class="cycleBox"><a onMouseOver="LinkHover()" onMouseOut="LinkOut()" onClick="EmptyClick()" id="doBack" ></a></div>
		<div id="confession" class="confessBox">
			
		</div>
		<div id="forward" class="cycleBox"><a onMouseOver="LinkHover()" onMouseOut="LinkOut()" onClick="EmptyClick()"  id="doForward"></a></div>
	</div>
	
	<a id="linkToSubmitConf" onMouseOver="LinkHover()" onMouseOut="LinkOut()" onClick="LinkClick('confess.html')">SUBMIT YOUR CONFESSION</a>
	
</body>
</html>
