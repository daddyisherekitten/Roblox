<!doctype html><html><head><meta charset="utf-8"><title>Contextual animation values</title><style>html,body{margin:0;padding:0}</style></head><body><pre id="report"></pre><script>
const cases=[
 {name:'variable opacity remains unclamped until additive composition',css:'#box{opacity:.4;--low:-.5;--high:.5}',source:"const a=hold({opacity:['var(--low)','var(--high)']},{duration:100,composite:'add',fill:'both'},50);record(getComputedStyle(box).opacity);a.commitStyles();a.cancel();record(box.style.opacity);"},
 {name:'nonlinear percentage lengths keep their basis through commit',css:'#parent{width:400px}#box{width:100px}',source:"const a=hold({width:['min(20%, 100px)','max(40%, 100px)']},{duration:100,fill:'both'},50);record(Math.round(box.getBoundingClientRect().width));a.commitStyles();a.cancel();record(Math.round(box.getBoundingClientRect().width));parent.style.width='600px';record(Math.round(box.getBoundingClientRect().width));"},
 {name:'additive nonlinear percentage keeps live underlying expression',css:'#parent{width:400px}#box{width:10%}',source:"const a=hold({width:['min(20%, 100px)','max(40%, 100px)']},{duration:100,composite:'add',fill:'both'},50);record(Math.round(box.getBoundingClientRect().width));a.commitStyles();a.cancel();record(Math.round(box.getBoundingClientRect().width));parent.style.width='600px';record(Math.round(box.getBoundingClientRect().width));"}
];const results=[];
for(const test of cases){const surface=document.createElement('div');surface.innerHTML='<style>#box{height:40px;background:white}'+test.css+'</style><div id="parent"><div id="box"></div></div>';document.body.prepend(surface);const box=document.getElementById('box'),parent=document.getElementById('parent'),actual=[];function hold(frames,options,time){const a=box.animate(frames,options);a.ready.catch(()=>{});a.finished.catch(()=>{});a.pause();a.currentTime=time;return a;}let error=null;try{Function('box','parent','hold','record',test.source)(box,parent,hold,v=>actual.push(String(v)));}catch(e){error=e.name+': '+e.message;}for(const a of document.getAnimations())a.cancel();surface.remove();results.push({...test,actual,error});}
document.getElementById('report').textContent=JSON.stringify(results,null,2);
</script></body></html>
