<!doctype html>
<html><head><meta charset="utf-8"><title>WAAPI zero duration reference</title></head><body><pre id="report"></pre><script>
const results=[];
for(const iterations of [0,1,2,Infinity])for(const iterationStart of [0,.3])for(const time of [-1,0,1]){
 const box=document.createElement('div');document.body.append(box);
 const animation=box.animate({opacity:[.2,.8]},{duration:0,iterations,iterationStart,fill:'both'});
 animation.finished.catch(()=>{});animation.ready.catch(()=>{});animation.pause();animation.currentTime=time;
 const timing=animation.effect.getComputedTiming();
 results.push({iterations:String(iterations),iterationStart,time,progress:timing.progress,currentIteration:String(timing.currentIteration),activeDuration:timing.activeDuration,endTime:timing.endTime,opacity:getComputedStyle(box).opacity});
 animation.cancel();box.remove();
}
document.getElementById('report').textContent=JSON.stringify(results,null,2);window.zeroDurationReport=results;
</script></body></html>
