<!doctype html><html><head><meta charset="utf-8"></head><body><div id="a"></div><div id="b"></div><pre id="report"></pre><script>const fixtures=[{"name":"TouchList indexed operations","source":"const a=document.getElementById('a'),t=new Touch({identifier:1,target:a});const l=new TouchEvent('x',{touches:[t]}).touches;for(const [name,fn]of [['set0',()=>Reflect.set(l,'0',null)],['set9',()=>Reflect.set(l,'9',t)],['define0null',()=>Reflect.defineProperty(l,'0',{value:null})],['define0write',()=>Reflect.defineProperty(l,'0',{writable:true})],['define0get',()=>Reflect.defineProperty(l,'0',{get(){return null;}})],['define9',()=>Reflect.defineProperty(l,'9',{value:t})],['delete9',()=>Reflect.deleteProperty(l,'9')],['strict0',()=>{(function(){'use strict';l[0]=null;})();return true;}],['strict9',()=>{(function(){'use strict';l[9]=t;})();return true;}]] ){try{record(name+':'+fn()+':'+(l[0]===t)+':'+(l[9]===undefined));}catch(e){record(name+':'+e.name);}}","expected":[]}];const results=[];for(const f of fixtures){const actual=[];try{new Function('record',f.source)(v=>actual.push(String(v)));results.push({name:f.name,actual,expected:f.expected,match:JSON.stringify(actual)===JSON.stringify(f.expected)});}catch(e){results.push({name:f.name,error:e.name+': '+e.message});}}document.getElementById('report').textContent=JSON.stringify(results,null,2);window.pointerTouchReport=results;</script></body></html>
